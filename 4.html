<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
	<style>
		.box{
			width: 150px;
			background-color: red;
		}
	</style>
</head>
<body>
	<div class="box"></div>
	<script>
		//4. Добавь высоту для дива при помощи переменных number и text
		let number = 150;
		let text = "px";
		document.querySelector(".box").style.height = number + text;

	</script>
</body>
</html>
